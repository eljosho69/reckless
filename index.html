<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabbalah & Islamic Neoplatonism - Side by Side</title>
    <style>
        :root {
            --bg: #0a0a14;
            --panel-bg: rgba(10, 10, 30, 0.95);
            --text: #e0d8c8;
            --text-light: #b8b0a0;
            --accent: #ffd700;
            --border: rgba(180, 160, 120, 0.3);
            --glow-soft: rgba(255, 215, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Georgia', 'Times New Roman', 'Palatino', serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            gap: 1.5rem;
            padding: 0.8rem;
            user-select: none;
            -webkit-user-select: none;
        }

        .map-container {
            flex: 1;
            height: 100%;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: #050510;
            box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 0 60px rgba(20,30,60,0.3);
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Tooltips */
        .tooltip {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            background: rgba(15, 15, 35, 0.92);
            border: 1px solid rgba(200, 170, 100, 0.5);
            border-radius: 10px;
            padding: 10px 16px;
            color: #f0e6d2;
            font-family: 'Georgia', 'Times New Roman', serif;
            text-align: center;
            opacity: 0;
            transform: translate(-50%, -120%);
            transition: opacity 0.18s ease, left 0.08s ease-out, top 0.08s ease-out;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 20px rgba(200,160,60,0.15);
            white-space: nowrap;
            letter-spacing: 0.03em;
        }
        .tooltip.visible { opacity: 1; }
        .tooltip .tt-label { font-size: 1.15rem; font-weight: bold; letter-spacing: 0.06em; }
        .tooltip .tt-subtitle { font-size: 0.8rem; color: #c0b090; margin-top: 2px; font-style: italic; }

        /* Info panels (inside each container) */
        .info-panel {
            position: absolute;
            z-index: 20;
            top: 50%;
            right: -420px;
            transform: translateY(-50%);
            width: 380px;
            max-width: 88%;
            max-height: 80%;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 24px 22px;
            color: var(--text);
            box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 40px var(--glow-soft);
            transition: right 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
            overflow-y: auto;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }
        .info-panel.open {
            right: 28px;
        }
        .info-panel .close-btn {
            position: absolute;
            top: 10px;
            right: 14px;
            width: 34px;
            height: 34px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            color: #c0b090;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            line-height: 1;
        }
        .info-panel .close-btn:hover {
            background: rgba(255,255,255,0.14);
            color: #fff;
            border-color: rgba(255,255,255,0.4);
        }
        .info-panel .node-color-dot {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 12px currentColor;
            vertical-align: middle;
        }
        .info-panel h2 {
            font-size: 1.8rem;
            letter-spacing: 0.05em;
            margin: 0 0 2px 0;
            font-weight: normal;
        }
        .info-panel h3 {
            font-size: 1rem;
            color: #b8a880;
            font-style: italic;
            font-weight: normal;
            margin: 0 0 16px 0;
            letter-spacing: 0.04em;
        }
        .detail-section {
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(200,170,100,0.15);
            padding-bottom: 8px;
        }
        .detail-section:last-child { border-bottom: none; }
        .detail-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #b8a880;
            margin-bottom: 3px;
        }
        .detail-value {
            color: #e0d8c8;
            white-space: pre-wrap;
        }

        @media (max-width: 800px) {
            body {
                flex-direction: column;
                gap: 0.5rem;
                padding: 0.4rem;
            }
            .info-panel {
                width: 92%;
                right: -105%;
                top: auto;
                bottom: 20px;
                transform: none;
                border-radius: 18px 18px 8px 8px;
                max-height: 55vh;
                padding: 20px 16px 16px;
            }
            .info-panel.open {
                right: 4%;
            }
        }
    </style>
</head>
<body>
    <!-- Kabbalah Map (Left) -->
    <div class="map-container" id="kabbalah-container">
        <canvas id="treeCanvasKab"></canvas>
        <div class="tooltip" id="tooltipKab">
            <div class="tt-label"></div>
            <div class="tt-subtitle"></div>
        </div>
        <div class="info-panel" id="infoPanelKab">
            <button class="close-btn" aria-label="Close panel">✕</button>
            <h2><span class="node-color-dot"></span><span class="panel-name"></span></h2>
            <h3 class="panel-subtitle"></h3>
            <div class="desc"></div>
        </div>
    </div>

    <!-- Islamic Neoplatonic Waterfall (Right) -->
    <div class="map-container" id="islamic-container">
        <canvas id="treeCanvasIslam"></canvas>
        <div class="tooltip" id="tooltipIslam">
            <div class="tt-label"></div>
            <div class="tt-subtitle"></div>
        </div>
        <div class="info-panel" id="infoPanelIslam">
            <button class="close-btn" aria-label="Close panel">✕</button>
            <h2><span class="node-color-dot"></span><span class="panel-name"></span></h2>
            <h3 class="panel-subtitle"></h3>
            <div class="desc"></div>
        </div>
    </div>

    <script>
        // ─────────────────────────────────────
        // SHARED UTILITY
        // ─────────────────────────────────────
        function blendColors(c1, c2, t) {
            const r1 = parseInt(c1.slice(1,3),16), g1 = parseInt(c1.slice(3,5),16), b1 = parseInt(c1.slice(5,7),16);
            const r2 = parseInt(c2.slice(1,3),16), g2 = parseInt(c2.slice(3,5),16), b2 = parseInt(c2.slice(5,7),16);
            const r = Math.round(r1 + (r2-r1)*t), g = Math.round(g1 + (g2-g1)*t), b = Math.round(b1 + (b2-b1)*t);
            return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');
        }

        // ─────────────────────────────────────
        // KABBALAH TREE OF LIFE MAP
        // ─────────────────────────────────────
        (function() {
            const NODES = [
                { id:"keter", label:"Keter", subtitle:"The Crown", x:0.50,y:0.08,r:0.040,color:"#fff8cc", detailedInfo:{
                    situation:"At the head of the Pillar of Equilibrium in the Supernal Triangle.",
                    magicalImage:"An ancient bearded king seen in profile.",
                    titles:"Existence of Existences. Concealed of the Concealed. Ancient of Ancients. Ancient of Days. The Primordial Light. The Point within the Circle. The Most High. The Vast Countenance. The White Head. The Head which is not. Macroprosopos. Amen. Lux Occulta. Lux Interna. He.",
                    godName:"Ehieh.",
                    archangel:"Metatron.",
                    angelicOrder:"Holy Living Creatures. Chaioth ha Qadesh.",
                    mundaneChakra:"Rashith ha Gilgalim. Primum Mobile. First Swirlings.",
                    spiritualExperience:"Union with God.",
                    virtue:"Attainment. Completion of the Great Work.",
                    vice:"----",
                    symbols:"The Point. The Crown. The Swastika.",
                    soulAspect:"Yechidah, Pure Spark of Ain Soph Aur.",
                    microcosm:"The Cranium. The Sah. Yechidah. The Divine Spark. The Thousand-petalled Lotus.",
                    colours:{ atziluth:"Brilliance.", briah:"Pure White brilliance.", yetzirah:"Pure White brilliance.", assiah:"White, flecked gold." },
                    gemstone:"Diamond.",
                    incense:"Ambergris.",
                    magicalWeapon:"Crown or Headress.",
                    tarotCards:"The four Aces.",
                    description:"Kether, the First Sephirah of Manifestation, crystalised into existence out of Ain Soph Aur. It is symbolised by a point, the simplest of all symbols, having position but no dimensions."
                }},
                { id:"binah", label:"Binah", subtitle:"Understanding", x:0.33,y:0.20,r:0.038,color:"#4d6fff", detailedInfo:{
                    situation:"Completes the Supernal Triangle, on the Pillar of Severity.",
                    magicalImage:"A mature woman or matron.",
                    titles:"The Throne (Kursiya), Ama (dark sterile mother), Aima (bright fertile mother), Marah (the great sea), Sanctifying Intelligence.",
                    godName:"Jehovah Elohim (YHVH Elohim).",
                    archangel:"Tzaphkiel.",
                    angelicOrder:"Thrones (Er'elim).",
                    mundaneChakra:"Saturn.",
                    spiritualExperience:"Vision of Sorrow.",
                    virtue:"Silence.",
                    vice:"Avarice.",
                    symbols:"The Cup, the Triangle, the Yoni, the Outer Robe of Concealment.",
                    colours:{ atziluth:"Crimson.", briah:"Black.", yetzirah:"Dark brown.", assiah:"Grey, flecked pink." },
                    gemstone:"Pearl and Sapphire.",
                    incense:"Myrrh or Civet.",
                    magicalWeapon:"The Cup.",
                    tarotCards:"The four Threes.",
                    description:"Binah is the third sephirah, the Supernal Mother. It transforms the creative energy of Chokmah into form and structure."
                }},
                { id:"chokmah", label:"Chokmah", subtitle:"Wisdom", x:0.67,y:0.20,r:0.038,color:"#e0e0e0", detailedInfo:{
                    situation:"On the Pillar of Mercy, the second Sephirah, the Supernal Father.",
                    magicalImage:"A bearded male figure.",
                    titles:"The Illuminating Intelligence, the Supernal Father, Ab, Mazloth (the Zodiac).",
                    godName:"Yah.",
                    archangel:"Raziel.",
                    angelicOrder:"Auphanim (Wheels).",
                    mundaneChakra:"Mazloth (the Zodiac).",
                    spiritualExperience:"The Vision of God face to face.",
                    virtue:"Devotion.",
                    vice:"----",
                    symbols:"The Lingam, the Inner Robe of Glory, the Phallus.",
                    colours:{ atziluth:"Pure soft blue.", briah:"Grey.", yetzirah:"Iridescent pearl.", assiah:"White, flecked red, blue, yellow." },
                    gemstone:"Star Ruby, Turquoise.",
                    incense:"Musk.",
                    magicalWeapon:"The Wand.",
                    tarotCards:"The four Twos.",
                    description:"Chokmah is the second sephirah, pure wisdom. It is the channel through which Kether's unity divides into the 12 rays of the zodiac."
                }},
                { id:"geburah", label:"Geburah", subtitle:"Strength", x:0.33,y:0.38,r:0.038,color:"#ff4040", detailedInfo:{
                    situation:"On the Pillar of Severity, the fifth Sephirah, sphere of judgment.",
                    magicalImage:"A mighty warrior king in his chariot going forth to war.",
                    titles:"Din (Justice), Pachad (Fear).",
                    godName:"Elohim Gibor.",
                    archangel:"Kamael.",
                    angelicOrder:"Seraphim (Fiery Serpents).",
                    mundaneChakra:"Mars.",
                    spiritualExperience:"Vision of Power.",
                    virtue:"Energy and courage.",
                    vice:"Cruelty and destruction.",
                    symbols:"The pentagram, five-petalled rose, sword, spear, scourge and chain.",
                    colours:{ atziluth:"Orange.", briah:"Scarlet.", yetzirah:"Bright scarlet.", assiah:"Red, with black." },
                    gemstone:"Ruby.",
                    incense:"Tobacco.",
                    magicalWeapon:"The Sword.",
                    tarotCards:"The four Fives.",
                    description:"Geburah corrects imbalance through sudden, stringent Martian methods. Its keywords are strength, severity, justice and awe."
                }},
                { id:"chesed", label:"Chesed", subtitle:"Mercy", x:0.67,y:0.38,r:0.038,color:"#00aaff", detailedInfo:{
                    situation:"On the Pillar of Mercy, the fourth Sephirah, also called Gedulah.",
                    magicalImage:"A crowned, enthroned king.",
                    titles:"Gedulah (Greatness), El (God), the Mighty One.",
                    godName:"El.",
                    archangel:"Tzadkiel.",
                    angelicOrder:"Chasmalim (Brilliant Ones).",
                    mundaneChakra:"Jupiter.",
                    spiritualExperience:"Vision of Love.",
                    virtue:"Obedience.",
                    vice:"Bigotry, hypocrisy, gluttony, tyranny.",
                    symbols:"The solid figure, the orb, the wand, the scepter, the crook.",
                    colours:{ atziluth:"Deep violet.", briah:"Blue.", yetzirah:"Deep purple.", assiah:"Deep azure, flecked yellow." },
                    gemstone:"Amethyst, Sapphire.",
                    incense:"Cedar.",
                    magicalWeapon:"The Scepter.",
                    tarotCards:"The four Fours.",
                    description:"Gedulah represents loving-kindness, boundless generosity, and the merciful aspect of the divine."
                }},
                { id:"tiphareth", label:"Tiphareth", subtitle:"Beauty", x:0.50,y:0.55,r:0.042,color:"#ffd700", description:"The harmonizing center where mercy and judgment find balance. Associated with the sun and the sacrificed god." },
                { id:"hod", label:"Hod", subtitle:"Splendor", x:0.33,y:0.73,r:0.036,color:"#ff9900", description:"Intellectual clarity and the power of communication. Sphere of prophecy and structured thought." },
                { id:"netzach", label:"Netzach", subtitle:"Victory", x:0.67,y:0.73,r:0.036,color:"#44ff66", description:"Endurance and the vibrant forces of nature. Sphere of creativity, passion, and the will to overcome." },
                { id:"yesod", label:"Yesod", subtitle:"Foundation", x:0.50,y:0.86,r:0.038,color:"#8844ff", description:"The bridge between the divine and the physical. Governs dreams, intuition, and the astral realm." },
                { id:"malkuth", label:"Malkuth", subtitle:"Kingdom", x:0.50,y:0.97,r:0.040,color:"#ff44ff", description:"The physical world and final manifestation. The material universe and our embodied existence." }
            ];

            const PATH_DEFS = [
                { from:"keter", to:"binah" }, { from:"keter", to:"chokmah" }, { from:"binah", to:"chokmah" },
                { from:"binah", to:"geburah" }, { from:"chokmah", to:"chesed" },
                { from:"geburah", to:"tiphareth" }, { from:"chesed", to:"tiphareth" },
                { from:"geburah", to:"hod" }, { from:"chesed", to:"netzach" },
                { from:"tiphareth", to:"netzach" }, { from:"tiphareth", to:"hod" },
                { from:"netzach", to:"yesod" }, { from:"hod", to:"yesod" }, { from:"yesod", to:"malkuth" }
            ];

            const nodeMap = {};
            NODES.forEach(n => nodeMap[n.id] = n);
            const PATH_DATA = PATH_DEFS.map(def => ({
                from:def.from, to:def.to,
                middleColor: blendColors(nodeMap[def.from].color, nodeMap[def.to].color, 0.5)
            }));

            const container = document.getElementById('kabbalah-container');
            const canvas = document.getElementById('treeCanvasKab');
            const ctx = canvas.getContext('2d');
            const tooltip = document.getElementById('tooltipKab');
            const tooltipLabel = tooltip.querySelector('.tt-label');
            const tooltipSubtitle = tooltip.querySelector('.tt-subtitle');
            const infoPanel = document.getElementById('infoPanelKab');
            const panelName = infoPanel.querySelector('.panel-name');
            const panelSubtitle = infoPanel.querySelector('.panel-subtitle');
            const panelDesc = infoPanel.querySelector('.desc');
            const panelDot = infoPanel.querySelector('.node-color-dot');
            const closeBtn = infoPanel.querySelector('.close-btn');

            let selectedNodeId = null, hoveredNodeId = null;
            let userScale = 1.0, panX = 0, panY = 0;
            let isDragging = false, dragStartX=0, dragStartY=0, dragStartPanX=0, dragStartPanY=0;
            let animationTime = 0;
            const particles = [], stars = [];
            let lastTouchX=0, lastTouchY=0, touchStartTime=0;

            const designW = 800, designH = 1050, paddingFactor = 0.09;
            let W, H, baseScale;

            function resize() {
                const rect = container.getBoundingClientRect();
                W = rect.width;
                H = rect.height;
                const dpr = Math.min(window.devicePixelRatio||1,2);
                canvas.width = W*dpr; canvas.height = H*dpr;
                canvas.style.width = W+'px'; canvas.style.height = H+'px';
                ctx.setTransform(1,0,0,1,0,0);
                ctx.scale(dpr,dpr);
                baseScale = Math.min((W*(1-paddingFactor*2))/designW, (H*(1-paddingFactor*2))/designH);
                generateStars();
            }
            function generateStars() {
                stars.length = 0;
                const count = Math.min(150, Math.floor((W*H)/3000));
                for(let i=0;i<count;i++) stars.push({
                    x:Math.random()*W, y:Math.random()*H,
                    r:Math.random()*1.4+0.3, baseAlpha:Math.random()*0.6+0.2,
                    phase:Math.random()*Math.PI*2, freq:Math.random()*0.6+0.3
                });
            }
            function getTotalScale() { return baseScale * userScale; }
            function worldToScreen(wx,wy) {
                const s = getTotalScale();
                const ox = (W - designW*s)/2 + panX, oy = (H - designH*s)/2 + panY;
                return { x: wx*s + ox, y: wy*s + oy };
            }
            function screenToWorld(sx,sy) {
                const s = getTotalScale();
                const ox = (W - designW*s)/2 + panX, oy = (H - designH*s)/2 + panY;
                return { x: (sx-ox)/s, y: (sy-oy)/s };
            }
            function getNodeScreenPos(node) { return worldToScreen(node.x*designW, node.y*designH); }
            function getNodeScreenRadius(node) { return node.r * designW * getTotalScale(); }

            function initParticles() {
                particles.length = 0;
                PATH_DEFS.forEach((def,idx) => {
                    for(let i=0;i<3;i++) particles.push({
                        pathIndex:idx, t:Math.random(),
                        direction:Math.random()>0.5?1:-1, speed:0.0006+Math.random()*0.0012,
                        size:1.2+Math.random()*2.0, alpha:0.5+Math.random()*0.5, phase:Math.random()*Math.PI*2
                    });
                });
            }
            function updateParticles(dt) {
                const dtc = Math.min(dt,0.1);
                particles.forEach(p => {
                    p.t += p.direction * p.speed * dtc * 60;
                    if(p.t>=1.0) { p.t=1.0; p.direction=-1; }
                    else if(p.t<=0.0) { p.t=0.0; p.direction=1; }
                });
            }
            function getParticleScreenPos(p) {
                const def = PATH_DEFS[p.pathIndex];
                const f = nodeMap[def.from], t = nodeMap[def.to];
                const wx = f.x*designW + (t.x*designW - f.x*designW)*p.t;
                const wy = f.y*designH + (t.y*designH - f.y*designH)*p.t;
                return worldToScreen(wx, wy);
            }
            function hitTestNode(sx, sy) {
                let closest = null, bestDist = Infinity;
                NODES.forEach(node => {
                    const pos = getNodeScreenPos(node);
                    const rad = node.r * designW * getTotalScale();
                    const hitR = Math.max(rad*1.6, 18);
                    const dx = sx-pos.x, dy = sy-pos.y, dist = Math.sqrt(dx*dx+dy*dy);
                    if(dist < hitR && dist < bestDist) { bestDist = dist; closest = node; }
                });
                return closest;
            }

            function hexToRgba(hex, alpha) {
                const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
                return `rgba(${r},${g},${b},${Math.max(0,Math.min(1,alpha))})`;
            }

            function drawBackground() {
                const bgGrad = ctx.createRadialGradient(W*0.5, H*0.45, H*0.08, W*0.5, H*0.5, Math.max(W,H)*0.85);
                bgGrad.addColorStop(0,'#111133'); bgGrad.addColorStop(0.35,'#0c0c22'); bgGrad.addColorStop(0.7,'#080818'); bgGrad.addColorStop(1,'#040410');
                ctx.fillStyle = bgGrad; ctx.fillRect(0,0,W,H);
                stars.forEach(s => {
                    const twinkle = s.baseAlpha + Math.sin(animationTime*s.freq+s.phase)*0.25;
                    ctx.fillStyle = `rgba(220,220,240,${Math.max(0.05, Math.min(1,twinkle))})`;
                    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
                });
            }

            function drawPathGlow(x1,y1,x2,y2,alpha) {
                const gw = 3.5*getTotalScale()*(designW/800);
                ctx.strokeStyle = `rgba(200,180,150,${alpha*0.35})`; ctx.lineWidth = gw*3; ctx.lineCap='round';
                ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
                ctx.strokeStyle = `rgba(220,200,170,${alpha*0.5})`; ctx.lineWidth = gw*1.5;
                ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
            }
            function drawPathLine(x1,y1,x2,y2, fromC, toC, midC, alpha) {
                const grad = ctx.createLinearGradient(x1,y1,x2,y2);
                grad.addColorStop(0, hexToRgba(fromC,alpha)); grad.addColorStop(0.5, hexToRgba(midC,alpha)); grad.addColorStop(1, hexToRgba(toC,alpha));
                ctx.strokeStyle = grad; ctx.lineWidth = Math.max(0.8, 1.3*getTotalScale()*(designW/800)); ctx.lineCap='round';
                ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
            }
            function drawAllPaths() {
                PATH_DATA.forEach(pd => {
                    const fn = nodeMap[pd.from], tn = nodeMap[pd.to];
                    const fp = getNodeScreenPos(fn), tp = getNodeScreenPos(tn);
                    let alpha = 0.75;
                    if(selectedNodeId && selectedNodeId!==pd.from && selectedNodeId!==pd.to) alpha = 0.25;
                    drawPathGlow(fp.x,fp.y,tp.x,tp.y,alpha);
                    drawPathLine(fp.x,fp.y,tp.x,tp.y, fn.color, tn.color, pd.middleColor, alpha);
                });
            }
            function drawParticles() {
                particles.forEach(p => {
                    const def = PATH_DEFS[p.pathIndex];
                    let alpha = p.alpha;
                    if(selectedNodeId && selectedNodeId!==def.from && selectedNodeId!==def.to) alpha *= 0.3;
                    if(alpha<0.08) return;
                    const pos = getParticleScreenPos(p), s = getTotalScale(), glowR = p.size*4*s*(designW/800);
                    const glow = ctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,glowR);
                    glow.addColorStop(0,`rgba(255,220,180,${alpha*0.9})`); glow.addColorStop(0.3,`rgba(255,220,180,${alpha*0.4})`); glow.addColorStop(1,'transparent');
                    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(pos.x,pos.y,glowR,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle = `rgba(255,240,210,${alpha})`; ctx.beginPath(); ctx.arc(pos.x,pos.y,p.size*s*(designW/800),0,Math.PI*2); ctx.fill();
                });
            }
            function drawNodeGlow(node, sp, sr) {
                const gr = sr*5;
                const glow = ctx.createRadialGradient(sp.x,sp.y,0,sp.x,sp.y,gr);
                const pulse = 1+Math.sin(animationTime*1.8 + NODES.indexOf(node)*0.7)*0.12;

                    const x = sp.x + Math.cos(angle)*sr*0.9;
                    const y = sp.y + Math.sin(angle)*sr*0.9;
                    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                }
                ctx.closePath(); ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
                ctx.beginPath(); ctx.arc(sp.x, sp.y, sr*0.5, 0, Math.PI*2);
                ctx.fillStyle = hexToRgba(node.color, 0.8); ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.stroke();
            }
            function drawAllNodes() {
                NODES.forEach(node => {
                    const sp = getNodeScreenPos(node), sr = getNodeScreenRadius(node);
                    let alpha = 1; if(selectedNodeId && selectedNodeId!==node.id) alpha=0.5;
                    ctx.globalAlpha = alpha;
                    drawNodeGlow(node, sp, sr); drawNodeBody(node, sp, sr);
                    ctx.globalAlpha = 1;
                    const fontSize = Math.max(9, sr*0.7);
                    ctx.font = `bold ${fontSize}px Georgia, serif`;
                    ctx.fillStyle = '#f0e6d2'; ctx.textAlign = 'center';
                    ctx.fillText(node.label, sp.x, sp.y - sr - 6);
                    ctx.font = `italic ${fontSize*0.7}px Georgia, serif`;
                    ctx.fillStyle = '#c0b090';
                    ctx.fillText(node.subtitle, sp.x, sp.y + sr + 14);
                });
            }
            function render() {
                ctx.clearRect(0,0,W,H);
                drawBackground();
                PATH_DATA.forEach(pd => {
                    const fn = nodeMap[pd.from], tn = nodeMap[pd.to];
                    const fp = getNodeScreenPos(fn), tp = getNodeScreenPos(tn);
                    let alpha = 0.85;
                    if(selectedNodeId && selectedNodeId!==pd.from && selectedNodeId!==pd.to) alpha = 0.3;
                    drawWaterfallPath(fp.x,fp.y,tp.x,tp.y, fn.color, tn.color, alpha);
                });
                particles.forEach(p => {
                    const def = PATH_DEFS[p.pathIndex];
                    let alpha = p.alpha;
                    if(selectedNodeId && selectedNodeId!==def.from && selectedNodeId!==def.to) alpha *= 0.3;
                    if(alpha<0.05) return;
                    const pos = getParticleScreenPos(p);
                    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                    ctx.beginPath(); ctx.arc(pos.x,pos.y, p.size*getTotalScale()*(designW/600),0,Math.PI*2); ctx.fill();
                });
                drawAllNodes();
            }

            function openInfoPanel(node) {
                selectedNodeId = node.id;
                panelName.textContent = node.label;
                panelSubtitle.textContent = node.subtitle;
                panelDot.style.backgroundColor = node.color;
                panelDot.style.color = node.color;
                panelDot.style.boxShadow = `0 0 14px ${node.color}`;
                let html = '';
                const d = node.detailedInfo;
                if (d) {
                    const add = (label, value) => { if(value) html += `<div class="detail-section"><div class="detail-label">${label}</div><div class="detail-value">${value}</div></div>`; };
                    add('Titles', d.titles); add('Description', d.description); add('Analogy', d.analogy); add('Source', d.source);
                }
                panelDesc.innerHTML = html;
                infoPanel.classList.add('open');
            }
            function closeInfoPanel() {
                selectedNodeId = null;
                infoPanel.classList.remove('open');
            }
            closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeInfoPanel(); });

            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
                const hit = hitTestNode(sx, sy);
                hoveredNodeId = hit ? hit.id : null;
                if (hoveredNodeId) {
                    const node = nodeMap[hoveredNodeId];
                    tooltipLabel.textContent = node.label;
                    tooltipSubtitle.textContent = node.subtitle;
                    tooltip.classList.add('visible');
                    document.body.classList.add('pointer-cursor');
                    tooltip.style.left = e.clientX - container.getBoundingClientRect().left + 'px';
                    tooltip.style.top = e.clientY - container.getBoundingClientRect().top + 'px';
                } else {
                    tooltip.classList.remove('visible');
                    document.body.classList.remove('pointer-cursor');
                }
                if(isDragging) {
                    panX = dragStartPanX + (e.clientX - dragStartX);
                    panY = dragStartPanY + (e.clientY - dragStartY);
                }
            });
            canvas.addEventListener('mousedown', (e) => {
                if(e.button!==0) return;
                isDragging = true; dragStartX = e.clientX; dragStartY = e.clientY; dragStartPanX = panX; dragStartPanY = panY;
            });
            canvas.addEventListener('mouseup', (e) => {
                const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
                if(Math.sqrt(dx*dx+dy*dy) <= 4) {
                    const rect = canvas.getBoundingClientRect();
                    const hit = hitTestNode(e.clientX - rect.left, e.clientY - rect.top);
                    hit ? openInfoPanel(hit) : closeInfoPanel();
                }
                isDragging = false;
            });
            canvas.addEventListener('mouseleave', () => { isDragging = false; tooltip.classList.remove('visible'); });
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
                const worldBefore = screenToWorld(sx, sy);
                const delta = -Math.sign(e.deltaY) * 0.08;
                userScale = Math.max(0.4, Math.min(3.5, userScale + delta * userScale));
                const worldAfter = screenToWorld(sx, sy);
                panX += (worldAfter.x - worldBefore.x) * getTotalScale();
                panY += (worldAfter.y - worldBefore.y) * getTotalScale();
            }, {passive:false});
            canvas.addEventListener('touchstart', (e) => {
                if(e.touches.length===1) {
                    const rect = canvas.getBoundingClientRect();
                    lastTouchX = e.touches[0].clientX - rect.left; lastTouchY = e.touches[0].clientY - rect.top;
                    touchStartTime = Date.now();
                    isDragging = true; dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY;
                    dragStartPanX = panX; dragStartPanY = panY;
                }
            });
            canvas.addEventListener('touchmove', (e) => {
                if(e.touches.length===1 && isDragging) {
                    panX = dragStartPanX + (e.touches[0].clientX - dragStartX);
                    panY = dragStartPanY + (e.touches[0].clientY - dragStartY);
                }
            });
            canvas.addEventListener('touchend', (e) => {
                if(e.touches.length===0 && isDragging) {
                    const dt = Date.now() - touchStartTime;
                    const dx = e.changedTouches[0].clientX - dragStartX, dy = e.changedTouches[0].clientY - dragStartY;
                    if(dt<300 && Math.sqrt(dx*dx+dy*dy)<8) {
                        const rect = canvas.getBoundingClientRect();
                        const hit = hitTestNode(e.changedTouches[0].clientX - rect.left, e.changedTouches[0].clientY - rect.top);
                        hit ? openInfoPanel(hit) : closeInfoPanel();
                    }
                }
                isDragging = false;
            });
            canvas.addEventListener('dblclick', (e) => {
                const rect = canvas.getBoundingClientRect();
                const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
                const hit = hitTestNode(sx, sy);
                if(hit) {
                    const wx = hit.x*designW, wy = hit.y*designH;
                    const oldScreen = worldToScreen(wx, wy);
                    userScale = Math.min(3.5, userScale*1.6);
                    const newScreen = worldToScreen(wx, wy);
                    panX += (oldScreen.x - newScreen.x);
                    panY += (oldScreen.y - newScreen.y);
                    openInfoPanel(hit);
                }
            });

            window.addEventListener('resize', () => {
                resize();
                const s = getTotalScale();
                panX = Math.max(-designW*s*0.5, Math.min(designW*s*0.5, panX));
                panY = Math.max(-designH*s*0.5, Math.min(designH*s*0.5, panY));
            });

            let lastTime = performance.now();
            function animate(time) {
                const dt = (time - lastTime)/1000;
                lastTime = time; animationTime = time/1000;
                updateParticles(dt);
                render();
                requestAnimationFrame(animate);
            }
            resize();
            initParticles();
            requestAnimationFrame(animate);
        })();
    </script>
</body>
</html>
