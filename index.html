<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>22 Node Metaphysical Tree</title>
<style>
body{margin:0;background:#eef2f7;font-family:Arial;overflow:hidden}
#toolbar{position:fixed;top:10px;left:10px;z-index:10}
#search{padding:8px;width:220px}
#viewport{width:100vw;height:100vh;overflow:hidden}
#scene{position:relative;width:1000px;height:1400px;transform-origin:0 0}
svg{position:absolute;inset:0}
line{stroke:#888;stroke-width:2}
.node{position:absolute;width:64px;height:64px;border-radius:50%;background:#fff;border:3px solid #333;
display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;
transform:translate(-50%,-50%);cursor:pointer;transition:.2s}
.node:hover{transform:translate(-50%,-50%) scale(1.1);box-shadow:0 0 15px #7aa7ff}
#modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}
#card{background:#fff;padding:20px;border-radius:12px;width:420px;max-width:90%}
</style></head><body>
<div id="toolbar"><input id="search" placeholder="Search node..."></div>
<div id="viewport"><div id="scene"><svg id="lines"></svg><div id="nodes"></div></div></div>
<div id="modal"><div id="card"><h2 id="mt"></h2><p id="md"></p><button onclick="modal.style.display='none'">Close</button></div></div>
<script>
const coords=[
[500,80],[350,170],[650,170],[250,280],[500,280],[750,280],[350,390],[650,390],[500,500],
[200,610],[400,610],[600,610],[800,610],[300,720],[500,720],[700,720],[220,830],[400,830],[600,830],[780,830],[500,940],[500,1080]
];
const nodes=coords.map((c,i)=>({id:i,title:"Node "+(i+1),text:"Add your metaphysical notes here.",x:c[0],y:c[1]}));
const edges=[[0,1],[0,2],[1,3],[1,4],[2,4],[2,5],[3,6],[4,6],[4,7],[5,7],[6,8],[7,8],[8,9],[8,10],[8,11],[8,12],[9,13],[10,13],[10,14],[11,14],[11,15],[12,15],[13,16],[13,17],[14,17],[14,18],[15,18],[15,19],[16,20],[17,20],[18,20],[19,20],[20,21]];
const ns=document.getElementById("nodes"),svg=document.getElementById("lines");
edges.forEach(e=>{let a=nodes[e[0]],b=nodes[e[1]],l=document.createElementNS("http://www.w3.org/2000/svg","line");
l.setAttribute("x1",a.x);l.setAttribute("y1",a.y);l.setAttribute("x2",b.x);l.setAttribute("y2",b.y);svg.appendChild(l);});
nodes.forEach(n=>{let d=document.createElement("div");d.className="node";d.style.left=n.x+"px";d.style.top=n.y+"px";d.innerHTML=n.title;
d.onclick=()=>{mt.textContent=n.title;md.textContent=n.text;modal.style.display="flex"};ns.appendChild(d);n.el=d;});
search.oninput=()=>{let q=search.value.toLowerCase();nodes.forEach(n=>n.el.style.display=n.title.toLowerCase().includes(q)?"flex":"none");};
let scale=0.8,ox=0,oy=0,drag=false,sx,sy;
function apply(){scene.style.transform=`translate(${ox}px,${oy}px) scale(${scale})`;}
viewport.onwheel=e=>{e.preventDefault();scale*=e.deltaY<0?1.1:.9;apply();}
viewport.onmousedown=e=>{drag=true;sx=e.clientX-ox;sy=e.clientY-oy;}
window.onmouseup=()=>drag=false;
window.onmousemove=e=>{if(drag){ox=e.clientX-sx;oy=e.clientY-sy;apply();}}
apply();
</script></body></html>
